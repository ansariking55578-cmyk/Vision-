<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maths Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: #00bcd4;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            font-size: 32px;
            margin: 0;
        }

        /* Main */
        .container {
            width: 100%;
            max-width: 750px;
            margin: 40px auto;
            padding: 0 15px;
        }

        /* Boxes */
        .box {
            width: 100%;
            height: 180px;
            background-color: white;
            border-radius: 15px;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transition: 0.2s;
        }

        .box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }

        .box a {
            text-decoration: none;
            color: #00a6b8;
            font-size: 30px;
            font-weight: bold;
        }

        /* Footer */
        footer {
            width: 100%;
            background-color: #00bcd4;
            color: white;
            text-align: center;
            padding: 20px 10px;
            margin-top: 40px;
        }

        footer p {
            margin: 0;
            font-size: 15px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            header h1 {
                font-size: 28px;
            }

            .container {
                margin: 25px auto;
                padding: 0 12px;
            }

            .box {
                height: 160px;
                margin: 25px 0;
            }

            .box a {
                font-size: 24px;
            }

            footer p {
                font-size: 14px;
            }

            footer p {
                width: 100%;
                background-color: #00bcd4;
                color: white;
                text-align: center;
                padding: 20px 10px;
                margin-top: 4px;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
            }

        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Government Jobs And Study</h1>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Government Jobs Box -->
        <div class="box">
            <a href="./govtjobs.html">Government Jobs</a>
        </div>

        <!-- Study Materials Box -->
        <div class="box">
            <a href="./home.html">Class 9 Notes</a>
        </div>

    </main>

    <!-- Footer -->
    <footer style="margin-top: 88%;">
        <p>© 2026 Maths Hub. All Right Reserved.</p>
    </footer>

</body>

</html>
